<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172b40">
    <meta name="description" content="十二座漂浮的心灵小岛。把时间留给樱花、炉火、海风与星光。">
    <title>Soul Sanctuary · 心之栖所</title>
    <style>
        :root {
            --ink: #f3ecdf; --muted: #c0c6cc; --accent: #efbcaa;
            --sky-top: #142237; --sky-bottom: #45576b; --sky-glow: #8d626a;
            --line: rgba(244, 235, 221, .2); --glass: rgba(17, 30, 45, .45);
            --serif: "Palatino Linotype", "Songti SC", "Noto Serif SC", "SimSun", serif;
            --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #172b40; font-family: var(--sans); color: var(--ink); }
        body { background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)); }
        body::before {
            content: ""; position: fixed; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse at 50% 44%, var(--sky-glow), transparent 62%);
            opacity: .5; transition: background 1.2s ease;
        }
        body::after {
            content: ""; position: fixed; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse at 50% 44%, transparent 38%, rgba(9, 19, 32, .36));
        }
        canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: grab; touch-action: none; }
        canvas:active { cursor: grabbing; }
        button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
        svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .hud-header { position: fixed; z-index: 2; top: max(30px, env(safe-area-inset-top)); left: 42px; right: 42px; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; gap: 14px; align-items: center; }
        .brand-mark { width: 34px; height: 42px; color: var(--accent); }
        .brand-name { font-family: var(--serif); font-size: 20px; letter-spacing: 1px; }
        .brand-sub { display: block; font-size: 9px; letter-spacing: 3px; margin-top: 5px; color: var(--muted); }
        .atlas-button { border: 1px solid var(--line); border-radius: 30px; background: var(--glass); padding: 12px 20px; display: flex; gap: 10px; align-items: center; font-size: 12px; letter-spacing: 2px; backdrop-filter: blur(12px); }
        .atlas-button:hover { border-color: var(--accent); background: rgba(234, 209, 178, .1); }
        .chapter { position: fixed; z-index: 2; top: 145px; left: 44px; pointer-events: none; }
        .eyebrow { font-size: 10px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
        .chapter-line { width: 30px; height: 1px; background: var(--accent); margin: 15px 0; opacity: .6; }
        .chapter-note { font-family: var(--serif); font-size: 14px; color: var(--muted); letter-spacing: 3px; }
        .atmosphere { position: fixed; right: 44px; top: 148px; z-index: 2; text-align: right; pointer-events: none; }
        .atmosphere-label { font-size: 9px; letter-spacing: 3px; color: var(--muted); }
        .atmosphere-value { font-family: var(--serif); font-size: 15px; letter-spacing: 3px; margin-top: 12px; }
        .station-info { position: fixed; left: 44px; bottom: max(48px, env(safe-area-inset-bottom)); z-index: 2; pointer-events: none; max-width: 580px; }
        .station-info h1 { font-family: var(--serif); font-size: clamp(30px, 3.2vw, 46px); font-weight: 400; letter-spacing: 8px; margin: 12px 0 16px; text-shadow: 0 2px 20px rgba(10, 20, 30, .2); }
        .station-info p { color: #d5d4d0; font-size: 12px; line-height: 1.9; letter-spacing: 2px; }
        .station-number { color: var(--accent); margin-right: 15px; }
        .travel-controls { position: fixed; bottom: max(50px, env(safe-area-inset-bottom)); right: 44px; z-index: 2; width: 290px; }
        .nav-buttons { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
        .round-btn { height: 46px; width: 46px; border: 1px solid var(--line); background: var(--glass); border-radius: 50%; display: grid; place-items: center; backdrop-filter: blur(10px); transition: background .2s, border-color .2s; }
        .round-btn:hover, .cruise-button:hover { background: rgba(238, 216, 185, .12); border-color: var(--accent); }
        .cruise-button { display: flex; gap: 10px; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--glass); border-radius: 30px; height: 46px; min-width: 158px; font-size: 12px; letter-spacing: 2px; backdrop-filter: blur(10px); }
        .travel-status { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 9px; letter-spacing: 2px; color: var(--muted); }
        .cruise-track { height: 1px; width: 90px; background: var(--line); }
        .cruise-track span { display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; }
        .canvas-hint { position: fixed; z-index: 2; left: 50%; bottom: 34px; transform: translateX(-50%); font-size: 10px; letter-spacing: 2px; color: var(--muted); opacity: .75; pointer-events: none; }
        .station-dots { position: fixed; z-index: 2; right: 46px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 13px; }
        .station-dot { width: 18px; height: 18px; border: 0; background: transparent; display: grid; place-items: center; }
        .station-dot::after { content: ""; width: 4px; height: 4px; background: var(--muted); opacity: .45; border-radius: 50%; transition: transform .3s, opacity .3s; }
        .station-dot[aria-current="true"]::after { background: var(--accent); opacity: 1; transform: scale(1.8); box-shadow: 0 0 12px var(--accent); }
        .station-dot:hover::after { opacity: 1; transform: scale(1.5); }
        .scene-title-enter { animation: title-enter .7s ease both; }
        @keyframes title-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        dialog { position: fixed; margin: auto; border: 1px solid var(--line); border-radius: 18px; background: #172838; color: var(--ink); width: min(1040px, calc(100% - 48px)); max-height: calc(100% - 64px); padding: 36px; box-shadow: 0 30px 100px #060d2190; }
        dialog::backdrop { background: rgba(7, 16, 26, .7); backdrop-filter: blur(14px); }
        .atlas-heading { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
        .atlas-heading h2 { font: 30px var(--serif); letter-spacing: 6px; margin-bottom: 10px; }
        .atlas-heading p { color: var(--muted); font-size: 12px; letter-spacing: 2px; line-height: 1.8; }
        .atlas-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
        .atlas-card { position: relative; text-align: left; padding: 0 0 16px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #ffffff04; transition: border-color .2s, background .2s; }
        .atlas-card:hover, .atlas-card[aria-current="true"] { border-color: var(--accent); background: #ffffff09; }
        .atlas-preview { height: 110px; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 90%, var(--card-glow), transparent 85%), var(--card-sky); color: var(--card-accent); position: relative; }
        .atlas-preview svg { width: 68px; height: 68px; stroke-width: .9; filter: drop-shadow(0 0 12px var(--card-accent)); }
        .atlas-card strong { display: block; font: 16px var(--serif); letter-spacing: 3px; margin: 14px 14px 6px; }
        .atlas-card small { display: block; font-size: 8px; letter-spacing: 1.8px; margin: 0 14px; color: var(--muted); }
        .atlas-card-number { position: absolute; top: 12px; left: 12px; font-size: 9px; letter-spacing: 2px; color: #f4ecdb99; }
        .atlas-footer { margin-top: 25px; text-align: center; font: 13px var(--serif); letter-spacing: 4px; color: var(--muted); }
        @media (max-width: 760px) {
            .hud-header { top: max(22px, env(safe-area-inset-top)); left: 22px; right: 22px; }
            .brand-name { font-size: 17px; } .brand-sub { font-size: 7px; letter-spacing: 2px; }
            .brand-mark { width: 26px; } .brand { gap: 9px; }
            .atlas-button { padding: 11px 13px; font-size: 11px; letter-spacing: 1px; }
            .chapter { left: 24px; top: 116px; } .chapter-note { font-size: 12px; }
            .atmosphere { top: 119px; right: 24px; } .atmosphere-value { font-size: 12px; }
            .atmosphere-label { font-size: 7px; }
            .station-info { left: 24px; right: 24px; bottom: max(125px, calc(env(safe-area-inset-bottom) + 110px)); text-align: center; max-width: none; }
            .station-info h1 { font-size: 29px; letter-spacing: 6px; margin: 10px 0; }
            .station-info .eyebrow { font-size: 8px; letter-spacing: 2px; }
            .station-info p { font-size: 10px; letter-spacing: 1px; }
            .travel-controls { width: 270px; bottom: max(35px, calc(env(safe-area-inset-bottom) + 22px)); left: 50%; right: auto; transform: translateX(-50%); }
            .nav-buttons { justify-content: center; } .travel-status { margin-top: 15px; }
            .canvas-hint, .station-dots { display: none; }
            dialog { padding: 22px; width: calc(100% - 28px); max-height: calc(100% - 36px); }
            .atlas-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .atlas-heading h2 { font-size: 24px; } .atlas-heading p { font-size: 10px; }
            .atlas-preview { height: 100px; } .atlas-card strong { font-size: 14px; }
        }
        @media (max-height: 600px) and (min-width: 761px) {
            .chapter, .atmosphere { top: 105px; } .station-info { bottom: 25px; }
            .station-info h1 { font-size: 28px; margin: 7px 0; }
            .travel-controls { bottom: 25px; } .canvas-hint { display: none; }
            .station-dots { gap: 4px; }
        }
        @media (max-height: 500px) and (max-width: 760px) {
            .hud-header { top: 16px; } .chapter, .atmosphere { display: none; }
            .station-info { left: 24px; right: auto; bottom: 22px; text-align: left; max-width: 48%; }
            .station-info h1 { font-size: 24px; margin-bottom: 0; } .station-info p { display: none; }
            .travel-controls { left: auto; right: 22px; bottom: 22px; transform: none; width: 270px; }
            .atlas-heading { margin-bottom: 16px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>

            { title: '沙海星眠', en: 'A THOUSAND QUIET YEARS', desc: '沙丘不催促，星辰不追问。今晚只管休息。', air: '暖沙 · 绿洲 · 星辰', sky: '#423448', horizon: '#ac8b87', glow: '#d9b190', accent: '#f4d5a3', rock: 0x927766, edge: 12, icon: '<path d="m7 50 23-36 23 36Z M30 14v36 M7 50h46 M48 43V22 M48 22q-7-10-13-3 M48 22q3-11 10-10 M48 22q-7-3-11 4 M48 22q7-4 11 2 M5 58h54"/>' },
            { title: '蓝风白屿', en: 'THE SEA CAN WAIT', desc: '让海风翻过白墙，把日子吹得轻一点。', air: '海盐 · 白墙 · 蓝风', sky: '#25435b', horizon: '#85a9b5', glow: '#cbbcaf', accent: '#e5dfbb', rock: 0x607d8e, edge: 12, icon: '<path d="M13 53V31h23v22 M11 31l14-9 13 9 M25 22V5 M9 10l31 20 M9 30 40 10 M25 22v22 M20 44h9v9 M43 53V39h13v14 M42 39q8-13 15 0 M4 59h55"/>' }
        ];
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const CRUISE_DURATION = 20;
        let currentIdx = 0;
        let isCruising = !reducedMotion.matches;
        let cruiseTimer = 0;
        let particles = [];

        let flickerLights = [];

        let isDragging = false;

        let previousTime = 0;
        const atlasDialog = document.getElementById('atlas-dialog');

        // ==================== 2. 核心3D渲染器初始化 ====================
        const scene = new THREE.Scene();
        const aspect = window.innerWidth / window.innerHeight;
        let viewSize = 10.8;
        const camera = new THREE.OrthographicCamera(-viewSize * aspect, viewSize * aspect, viewSize, -viewSize, .1, 120);
        camera.position.set(16, 13, 18);
        camera.lookAt(0, .4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });

        glowGradient.addColorStop(.2, 'rgba(255,255,255,.3)');

        glowContext.fillStyle = glowGradient;
        glowContext.fillRect(0, 0, 64, 64);
        const glowTexture = new THREE.CanvasTexture(glowCanvas);
        const starPositions = [];

            starPositions.push((Math.random() - .5) * 60, Math.random() * 28 - 3, -24 - Math.random() * 12);
        }

        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));

        scene.add(stars);

        // ==================== 3. 工具函数 ====================
        function clearWorld() {
            const geometries = new Set();
            const materials = new Set();
            worldGroup.traverse(object => {
                if (object.geometry) geometries.add(object.geometry);
                if (object.material) (Array.isArray(object.material) ? object.material : [object.material]).forEach(material => materials.add(material));
                if (object.shadow && object.shadow.map) object.shadow.map.dispose();
            });
            worldGroup.clear();
            geometries.forEach(geometry => geometry.dispose());
            materials.forEach(material => material.dispose());
            scene.children.filter(object => object.isDirectionalLight).forEach(light => {
                if (light.shadow.map) light.shadow.map.dispose();
                scene.remove(light);
            });
            particles = [];
            animatedObjects = [];
            flickerLights = [];
            artAnimations = [];
        }

        function addToWorld(obj) { worldGroup.add(obj); return obj; }

        function createBox(w, h, d, mat, x, y, z, cast=false, receive=false) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            if(x!==undefined) mesh.position.set(x, y, z);
            if(cast) mesh.castShadow = true;
            if(receive) mesh.receiveShadow = true;
            return mesh;
        }

        function resetParticle(p) {
            p.position.set(Math.random()*10 - 5, 6 + Math.random()*2, Math.random()*10 - 5);
        }

        // ==================== 4. 国家构建器 ====================

        // --- JAPAN ---
        function buildJapan(meta) {
            const m = {

                lantern: new THREE.MeshLambertMaterial({ color: 0x47516f, flatShading: true }),
                core: new THREE.MeshBasicMaterial({ color: 0xffdf6d })
            };

            // 浮空岛 + 草地
            addToWorld(createBox(12, 2, 12, m.island, 0, -1, 0, false, true));
            addToWorld(createBox(11.5, 0.4, 11.5, m.grass, 0, 0.2, 0, false, true));

            // 鸟居

            const tie = createBox(4.6, 0.4, 0.4, m.torii, 0, 3.2, 0, true);

            // 樱花树

            tree.add(createBox(0.6, 3, 0.6, m.trunk, 0, 1.5, 0, true));
            const leafData = [
                {w:3, h:1.5, d:3, x:0, y:3, z:0}, {w:2.2, h:1.2, d:2.2, x:0.5, y:4, z:-0.5}, {w:1.8, h:1, d:4, x:-0.6, y:2.8, z:0.3}

            // 灯光

            moonDir.shadow.mapSize.width = 256; moonDir.shadow.mapSize.height = 256;
            scene.add(moonDir);

        // --- CHINA ---
        function buildChina(meta) {

            // 幽竹群

                        b.add(createBox(0.4, 0.08, 0.2, m.bamboo, Math.random()>0.5?0.25:-0.25, cy+segH/2, 0, true));

                b.position.set(bx, 0, bz);
                return b;
            }
            [{x:3.5,z:-2.5,h:8},{x:2.5,z:-3.5,h:9},{x:3.8,z:-1,h:7},{x:-3.5,z:3,h:8},{x:-2.5,z:3.5,h:6},{x:-3.8,z:1.5,h:7}].forEach(p => addToWorld(createBamboo(p.x, p.z, p.h)));

        function artMaterial(color, luminous = false) {
            const material = luminous ? new THREE.MeshBasicMaterial({ color }) : new THREE.MeshLambertMaterial({ color, flatShading: true });
            material.color.convertSRGBToLinear();
            return material;
        }

        function voxelBatch(voxels, material, parent = worldGroup) {
            if (!voxels.length) return;
            const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), material, voxels.length);
            const transform = new THREE.Object3D();
            voxels.forEach((voxel, index) => {
                transform.position.set(voxel[0], voxel[1], voxel[2]);
                transform.scale.set(voxel[3], voxel[4], voxel[5]);
                transform.rotation.set(0, voxel[6] || 0, 0);
                transform.updateMatrix();
                mesh.setMatrixAt(index, transform.matrix);
            });
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.instanceMatrix.needsUpdate = true;
            parent.add(mesh);
            return mesh;
        }

        function addGlow(position, color, size, opacity = .24) {
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture, color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending }));
            sprite.position.copy(position);
            sprite.scale.set(size, size, 1);
            worldGroup.add(sprite);
            return sprite;
        }

        function addPlant(positionX, positionZ, color, height = .6, ground = .1) {
            const stem = artMaterial(0x5c8069);
            const petals = artMaterial(color);
            voxelBatch([[positionX, ground + height / 2, positionZ, .08, height, .08], [positionX + .1, ground + height * .5, positionZ, .3, .08, .12]], stem);
            voxelBatch([[positionX, ground + height, positionZ, .3, .16, .3], [positionX, ground + height + .12, positionZ, .15, .12, .15]], petals);
        }

        function addBench(positionX, positionZ, rotation = 0, ground = .12) {
            const bench = new THREE.Group();
            const wood = artMaterial(0xa88769);
            const iron = artMaterial(0x344752);
            voxelBatch([[0, .5, 0, 1.5, .12, .5], [0, .85, -.25, 1.5, .18, .09], [0, 1.08, -.25, 1.5, .14, .09]], wood, bench);
            voxelBatch([[-.55, .25, 0, .1, .5, .4], [.55, .25, 0, .1, .5, .4], [-.55, .75, -.25, .08, .8, .08], [.55, .75, -.25, .08, .8, .08]], iron, bench);
            bench.position.set(positionX, ground, positionZ);
            bench.rotation.y = rotation;
            worldGroup.add(bench);
        }

        function addLantern(positionX, positionY, positionZ, color = 0xffd095, scale = 1) {
            const lantern = new THREE.Group();
            const frame = artMaterial(0x634a48);
            voxelBatch([[0, .08, 0, .45, .12, .45], [0, .65, 0, .48, .12, .48], [-.19, .37, -.19, .055, .5, .055], [.19, .37, .19, .055, .5, .055], [-.19, .37, .19, .055, .5, .055], [.19, .37, -.19, .055, .5, .055]], frame, lantern);
            lantern.add(createBox(.3, .4, .3, artMaterial(color, true), 0, .36, 0));
            lantern.position.set(positionX, positionY, positionZ);
            lantern.scale.setScalar(scale);
            worldGroup.add(lantern);
            addGlow(new THREE.Vector3(positionX, positionY + .36 * scale, positionZ), color, 1.8 * scale, .32);
        }

        function addPool(positionX, positionZ, width, depth, color, ground = .05, border = true) {
            const waterMaterial = new THREE.MeshPhongMaterial({ color, specular: 0x20383d, shininess: 45 });
            waterMaterial.color.convertSRGBToLinear();
            waterMaterial.color.multiplyScalar(.32);
            waterMaterial.specular.convertSRGBToLinear();
            const pool = createBox(width, .08, depth, waterMaterial, positionX, ground, positionZ, false, true);
            worldGroup.add(pool);
            const ripples = [];
            for (let index = 0; index < 28; index++) {
                ripples.push([positionX + (Math.random() - .5) * width * .9, ground + .05, positionZ + (Math.random() - .5) * depth * .9, .15 + Math.random() * .5, .015, .04]);
            }
            const rippleMesh = voxelBatch(ripples, new THREE.MeshBasicMaterial({ color: 0x99d2cd, transparent: true, opacity: .22 }));
            rippleMesh.castShadow = false;
            artAnimations.push({ type: 'ripple', obj: rippleMesh, base: .22, phase: Math.random() * 6 });
            if (border) {
                const stones = [];
                for (let index = 0; index < 14; index++) {
                    const angle = index / 14 * Math.PI * 2;
                    stones.push([positionX + Math.cos(angle) * (width / 2 + .1), ground + .06, positionZ + Math.sin(angle) * (depth / 2 + .1), .35, .2, .35]);
                }
                voxelBatch(stones, artMaterial(0x839799));
            }
            return pool;
        }

        function addTree(positionX, positionZ, colors, height = 3, width = 2) {
            const tree = new THREE.Group();
            const trunk = artMaterial(0x6c5753);
            voxelBatch([[0, height / 2, 0, .28, height, .28], [-.28, height * .72, 0, .7, .16, .16], [.3, height * .86, .12, .8, .16, .16]], trunk, tree);
            colors.forEach((color, colorIndex) => {
                const leaves = [];
                for (let index = 0; index < 28; index++) {
                    const angle = index * 2.39996 + colorIndex;
                    const radius = Math.sqrt(index / 28) * width * .62;
                    leaves.push([Math.cos(angle) * radius, height + Math.sin(index * 1.8) * .45 + colorIndex * .23, Math.sin(angle) * radius, .4 + Math.random() * .25, .32 + Math.random() * .25, .45 + Math.random() * .2]);
                }
                voxelBatch(leaves, artMaterial(color), tree);
            });
            tree.position.set(positionX, .15, positionZ);
            worldGroup.add(tree);
            return tree;
        }

        function addPalm(positionX, positionZ, height = 3.6) {
            const palm = new THREE.Group();
            const wood = artMaterial(0x9d795c);
            const green = artMaterial(0x638d70);
            const trunk = [];
            for (let index = 0; index < 9; index++) trunk.push([Math.sin(index * .12) * .35, index * height / 9, 0, .27, height / 9 + .04, .27]);
            voxelBatch(trunk, wood, palm);
            const leaves = [];
            for (let branch = 0; branch < 6; branch++) {
                const angle = branch / 6 * Math.PI * 2;
                for (let segment = 0; segment < 5; segment++) {
                    const radius = .2 + segment * .28;
                    leaves.push([.3 + Math.cos(angle) * radius, height - .2 + Math.sin(segment / 4 * Math.PI) * .35, Math.sin(angle) * radius, .48, .12, .3, -angle]);
                }
            }
            voxelBatch(leaves, green, palm);
            palm.position.set(positionX, .1, positionZ);
            worldGroup.add(palm);
        }

        function addWindow(parent, positionX, positionY, positionZ, width = .7, height = .9, color = 0xffd294) {
            const glow = artMaterial(color, true);
            const frame = artMaterial(0x4a5357);
            parent.add(createBox(width, height, .035, glow, positionX, positionY, positionZ + .09));
            voxelBatch([[positionX, positionY, positionZ + .12, .05, height, .04], [positionX, positionY, positionZ + .12, width, .05, .04], [positionX, positionY - height / 2 - .04, positionZ + .12, width + .16, .1, .22]], frame, parent);
        }

                    worldGroup.add(createBox(.55, .04, .45, foliage, lotusX, .08, lotusZ));
                    voxelBatch([[lotusX, .18, lotusZ, .22, .2, .22], [lotusX, .27, lotusZ, .1, .12, .1]], artMaterial(index % 2 ? 0xeac2be : 0xe5d5ae));
                }
                addPalm(-4.2, -3.8, 3.6);
                const chedi = worldGroup.children.find(object => object.isGroup && object.position.x === 2.2);
                if (chedi) voxelBatch([[0, .15, 0, 3.2, .15, 3.2], [0, .85, 0, 2.4, .1, 2.4], [0, 1.5, 0, 1.8, .1, 1.8]], artMaterial(0xe9cd9f), chedi);
            } else if (meta.country === 'EGYPT') {
                const pyramid = worldGroup.children.find(object => object.isGroup && object.position.x === -1 && object.position.z === -1);
                if (pyramid) {
                    pyramid.children.forEach(child => { child.visible = false; });
                    const tiers = [];
                    for (let index = 0; index < 10; index++) tiers.push([-1, .2 + index * .38, -1, 5.4 - index * .5, .38, 5.4 - index * .5]);
                    voxelBatch(tiers, artMaterial(0xc5a574), pyramid);
                    const joints = [];
                    for (let row = 0; row < 8; row++) {
                        const edge = 5.4 - row * .5;
                        for (let column = 0; column < Math.floor(edge / .65); column++) joints.push([-1 - edge / 2 + .3 + column * .65, .2 + row * .38, -1 + edge / 2 + .015, .03, .3, .025]);
                    }
                    voxelBatch(joints, artMaterial(0xa78a67), pyramid);
                    pyramid.add(createBox(.45, .25, .45, artMaterial(0xf2dcb0), -1, 3.9, -1));
                }
                worldGroup.children.filter(object => object.isGroup && [[3, 3], [-3.5, 2], [2.5, -3]].some(position => object.position.x === position[0] && object.position.z === position[1])).forEach(object => { object.visible = false; });
                addPool(3, 2, 2.9, 2.8, 0x509191, .14);
                addPalm(4.3, 2.8, 3.4);
                addPalm(2, 3.6, 2.8);
                addPalm(4, -.2, 3.8);
                addLantern(.8, .1, 1.5, 0xffd69b, .7);
                const tent = new THREE.Group();
                voxelBatch([[0, .4, 0, 1.8, .8, 1.4], [0, .93, 0, 2.1, .2, 1.6], [0, 1.15, 0, 1.6, .2, 1.4], [0, 1.34, 0, .8, .2, 1.2]], artMaterial(0xba8584), tent);
                voxelBatch([[0, .3, .72, .6, .6, .04]], artMaterial(0x705b64), tent);
                tent.position.set(-3, .1, 3);
                worldGroup.add(tent);
                const dunes = [];
                for (let index = 0; index < 12; index++) dunes.push([2.5 + Math.sin(index) * 2.4, .06, -4 + Math.cos(index) * .8, .8, .08 + Math.random() * .12, .5]);
                voxelBatch(dunes, artMaterial(0xdec09a));
            } else if (meta.country === 'GREECE') {
                addPool(0, 0, 11.9, 11.9, 0x4a8fa3, .025, false);
                voxelBatch([[-1.2, .02, -1.2, 4.8, .2, 4.8], [2.5, .02, 2, 4, .2, 4], [-3, .02, 2.5, 3.2, .2, 3.2], [1, .02, -2.5, 2, .2, 2]], artMaterial(0xcdd4cb));
                const mill = worldGroup.children.find(object => object.isGroup && object.children.some(child => child.position.y === 6.2));
                if (mill) {
                    mill.children.filter(child => child.position.y === 6.2).forEach(child => { child.visible = false; });
                    mill.add(createBox(.2, .2, .2, artMaterial(0xd8c6a5), -1, 5.25, -1));
                }
                const wings = animatedObjects.find(object => object.type === 'windmill');
                if (wings) {
                    wings.obj.children.forEach(child => { child.visible = false; });
                    wings.obj.position.set(-1, 3.7, .61);
                    for (let index = 0; index < 4; index++) {
                        const blade = new THREE.Group();
                        voxelBatch([[.95, 0, 0, 1.9, .1, .1]], wood, blade);
                        voxelBatch([[1.28, .18, 0, .75, .38, .055]], artMaterial(0xf1e4c8), blade);
                        blade.rotation.z = index * Math.PI / 2;
                        wings.obj.add(blade);
                    }
                    wings.obj.add(createBox(.22, .22, .2, artMaterial(0xbc9972), 0, 0, .08));
                }
                const houses = worldGroup.children.filter(object => object.isGroup && [2.5, -3].includes(object.position.x));
                houses.forEach(house => {
                    addWindow(house, .5, 1.5, house.position.x === 2.5 ? 1.28 : 1.03, .5, .65);
                    voxelBatch([[-.5, .8, house.position.x === 2.5 ? 1.3 : 1.05, .6, 1.6, .05]], artMaterial(0x487eab), house);
                });
                const stairs = [];
                for (let index = 0; index < 6; index++) stairs.push([.2 + index * .35, .1 + index * .05, 2, .32, .15 + index * .1, .7]);
                voxelBatch(stairs, artMaterial(0xe1dfd1));
                const pergola = worldGroup.children.find(object => object.isGroup && object.position.z === -2.5);
                if (pergola) {
                    const vines = [];
                    for (let index = 0; index < 12; index++) vines.push([Math.sin(index * 2) * .5, 2.1, Math.cos(index * 2) * .5, .4, .14, .35]);
                    voxelBatch(vines, foliage, pergola);
                }
                addBench(1, -2.5, 0);
                addPlant(3.8, 1, 0xe5a9c0, .7);
                addPlant(-3.8, 3.5, 0xe5a9c0, .6);
                addLantern(.5, .1, 3.8, 0xffd5a3, .6);
            }
        }

        // ==================== 5. 主构建调度器 ====================
        function buildStation(idx) {
            clearWorld();
            const meta = STATIONS[idx];
            const art = ART[idx];
            currentIdx = idx;
            const root = document.documentElement.style;
            root.setProperty('--sky-top', art.sky);
            root.setProperty('--sky-bottom', art.horizon);
            root.setProperty('--sky-glow', art.glow);
            root.setProperty('--accent', art.accent);
            document.getElementById('station-title').textContent = art.title;
            document.getElementById('station-desc').textContent = art.desc;
            document.getElementById('station-en').textContent = art.en;
            document.getElementById('station-number').textContent = String(idx + 1).padStart(2, '0');
            document.getElementById('chapter-label').textContent = `CHAPTER ${String(idx + 1).padStart(2, '0')} / 12`;
            document.getElementById('atmosphere-value').textContent = art.air;
            const info = document.querySelector('.station-info');
            info.classList.remove('scene-title-enter');
            void info.offsetWidth;
            info.classList.add('scene-title-enter');
            document.querySelectorAll('[data-station]').forEach(button => button.setAttribute('aria-current', String(Number(button.dataset.station) === idx)));
            scene.background = null;
            scene.fog = new THREE.Fog(art.sky, 38, 75);
            ambientLight.color.setHex(0xbecbdc);
            ambientLight.intensity = .42;
            skyLight.color.set(meta.country === 'EGYPT' ? 0xf2d4bd : 0xc5d9e5);
            skyLight.groundColor.set(art.rock);
            stars.material.opacity = ['USA', 'EGYPT', 'GREECE'].includes(meta.country) ? .18 : .45;

            const builders = {
                "JAPAN": buildJapan, "CHINA": buildChina, "USA": buildUSA, "UK": buildUK,
                "FRANCE": buildFrance, "GERMANY": buildGermany, "ITALY": buildItaly,
                "DENMARK": buildDenmark, "ICELAND": buildIceland, "THAILAND": buildThailand,
                "EGYPT": buildEgypt, "GREECE": buildGreece
            };
            if(builders[meta.country]) builders[meta.country](meta);
            const palette = {
                0x223e4a: 0x537d73, 0x1a233a: 0x435064, 0x8f2d34: 0xb65d67, 0x181a24: 0x484959,
                0xd47394: 0xd889a8, 0x2d212f: 0x77544b, 0x47516f: 0x858d9b,
                0x1f3326: 0x4d7059, 0x1c2024: 0x546763, 0x2b4c33: 0x528869, 0x9c2c2c: 0xa95d53, 0x2d3238: 0x516469,
                0x211729: 0xad8989, 0x14101e: 0x555367, 0x244235: 0x648575,
                0x1c1e24: 0x647584, 0x2e323d: 0x788590, 0x3d2727: 0x806a68, 0x8a1c1c: 0xad5559, 0x16171a: 0x424e5b,
                0x1f1a24: 0x8e8791, 0x1c3127: 0x49695f, 0x3d271d: 0x715c53, 0x1b2d4a: 0x55778e,
                0x12161f: 0x8fabb5, 0x13261b: 0x426758, 0x2b1a11: 0x675550, 0x7a2b22: 0x965f5b,
                0x131419: 0x516c71, 0x22242c: 0x5e757a, 0x18181d: 0x344956, 0x732626: 0x9b6b6b,
                0x111b24: 0x476975, 0x2b2621: 0x8b8177, 0x1e222b: 0x4c5d6b, 0x8a3324: 0xb7786a,
                0x36343b: 0x838a8c, 0x112822: 0x426f69, 0x3d2015: 0x836853, 0x112547: 0x528699
            };
            const existingMaterials = new Set();
            worldGroup.traverse(object => { if (object.material) existingMaterials.add(object.material); });
            existingMaterials.forEach(material => {
                if (!material.color) return;
                const original = material.color.getHex();
                const replacement = meta.country === 'EGYPT' && original === 0xcca625 ? 0xd7b890 : palette[original];
                if (replacement) material.color.setHex(replacement);
                material.color.convertSRGBToLinear();
            });
            scene.children.filter(object => object.isDirectionalLight).forEach(light => {
                light.intensity *= .35;
                light.castShadow = false;
            });
            upgradeIsland(meta, art);
            upgradeDestination(meta);
            orbitAngle = 0;
            userOrbit = 0;
            reveal = reducedMotion.matches ? 1 : 0;
            cruiseTimer = 0;
            document.getElementById('cruise-progress').style.transform = 'scaleX(0)';
        }

        // ==================== 6. 渲染循环 ====================
        const clock = new THREE.Clock();

        function renderLoop(time = performance.now()) {
            requestAnimationFrame(renderLoop);
            const delta = previousTime ? Math.min((time - previousTime) / 1000, .1) : 1 / 60;
            previousTime = time;
            if (document.hidden) return;
            const elapsed = reducedMotion.matches ? 0 : clock.getElapsedTime();
            const frameScale = reducedMotion.matches ? 0 : delta * 60;
            if (!isDragging && !atlasDialog.open && !reducedMotion.matches) orbitAngle += delta * .018;
            worldGroup.rotation.y = orbitAngle + userOrbit;
            reveal = Math.min(1, reveal + delta * 1.6);
            worldGroup.position.y = Math.sin(elapsed * .45) * .07 - (1 - reveal) * .6;
            worldGroup.scale.setScalar(.96 + reveal * .04);
            artAnimations.forEach(animation => {
                if (animation.type === 'ripple') animation.obj.material.opacity = animation.base + Math.sin(elapsed * .7 + animation.phase) * .05;
                else if (animation.type === 'hover') animation.obj.position.y = animation.baseY + Math.sin(elapsed * .65 + animation.phase) * .12;
                else if (animation.type === 'koi') {
                    const phase = elapsed * .22 + animation.phase;
                    animation.obj.position.x = animation.centerX + Math.cos(phase);
                    animation.obj.position.z = animation.centerZ + Math.sin(phase) * .75;
                    animation.obj.rotation.y = -phase + Math.PI / 2;
                } else if (animation.type === 'steam') {
                    const age = (elapsed * .25 + animation.phase) % 1;
                    animation.obj.position.y = .2 + age * 1.9;
                    animation.obj.position.x = animation.baseX + Math.sin(elapsed * .4 + animation.phase) * .18;
                    animation.obj.material.opacity = Math.sin(age * Math.PI) * .23;
                } else if (animation.type === 'aurora') animation.obj.material.uniforms.time.value = elapsed;
            });

            // 动画对象更新
            animatedObjects.forEach(ao => {
                if(ao.type === 'gondola') {
                    ao.obj.rotation.z = Math.sin(elapsed * 1.5) * 0.025;
                    ao.obj.position.y = Math.cos(elapsed * 1.2) * 0.03;
                } else if(ao.type === 'sailboat') {
                    ao.obj.rotation.z = Math.sin(elapsed * 1.2) * 0.02;
                    ao.obj.rotation.x = Math.cos(elapsed * 0.9) * 0.015;
                    ao.obj.position.y = Math.sin(elapsed * 1.0) * 0.025;
                } else if(ao.type === 'windmill') {
                    ao.obj.rotation.z = elapsed * 0.2;
                } else if(ao.type === 'neon_sign') {
                    // 霓虹故障闪烁在灯光处理中
                }
            });

            // 粒子更新
            particles.forEach((p, idx) => {
                const ud = p.userData;
                if(!ud) return;

                if(ud.type === 'fall') {
                    p.position.y -= ud.speedY * frameScale * .4;
                    p.position.x += Math.sin(elapsed + idx) * 0.005 * frameScale;
                    if(p.rotation) { p.rotation.x += ud.rotSpeed * frameScale; p.rotation.y += ud.rotSpeed * .5 * frameScale; }
                    if(p.position.y < (ud.groundY || 0.4)) resetParticle(p);
                }
                else if(ud.type === 'firefly') {
                    ud.angle += ud.speed * frameScale * .4;
                    p.position.x += Math.cos(ud.angle) * .015 * frameScale;
                    p.position.z += Math.sin(ud.angle) * .015 * frameScale;
                    p.position.y += Math.sin(elapsed * 2 + ud.phase) * ud.yStep * frameScale * .4;
                    const sf = 0.6 + Math.sin(elapsed * 4.0 + idx) * 0.4;
                    p.scale.set(sf, sf, sf);
                    if(Math.abs(p.position.x)>5 || Math.abs(p.position.z)>5 || p.position.y>6 || p.position.y<0.2) {
                        p.position.set(Math.random()*6-3, Math.random()*3+0.5, Math.random()*6-3);
                    }
                }
                else if(ud.type === 'dust') {
                    p.position.x += ud.speedX * frameScale * .4;
                    p.position.y += Math.sin(elapsed * ud.oscillateSpeed) * ud.amplitude * frameScale;
                    if(p.position.x < -6) { p.position.x = 6; p.position.y = Math.random()*5+0.2; p.position.z = Math.random()*12-6; }
                }
                else if(ud.type === 'rain') {
                    p.position.y -= ud.speedY * frameScale;
                    if(p.position.y < 0.2) { p.position.y = 7+Math.random()*2; p.position.x = Math.random()*11-5.5; p.position.z = Math.random()*11-5.5; }
                }
                else if(ud.type === 'fall_spin') {
                    p.position.y -= ud.speedY * frameScale * .5;
                    p.position.x += Math.sin(elapsed * ud.swaySpeed + ud.seed) * ud.swayAmp * frameScale;
                    p.position.z += Math.cos(elapsed * ud.swaySpeed + ud.seed) * ud.swayAmp * .5 * frameScale;
                    p.rotation.x += ud.rotSpeed * frameScale;
                    p.rotation.y += ud.rotSpeed * .5 * frameScale;
                    if(p.position.y < 0.15) resetParticle(p);
                }
                else if(ud.type === 'snow') {
                    p.position.y -= ud.speedY * frameScale * .5;
                    p.position.x += ud.driftX * frameScale;
                    if(p.position.y < 0.15) { p.position.y = 7+Math.random()*1.5; p.position.x = Math.random()*10-5; p.position.z = Math.random()*10-5; }
                }
                else if(ud.type === 'rise') {
                    p.position.y += ud.vSpeed * frameScale;
                    p.position.x += Math.sin(elapsed * ud.sinSpeed) * .002 * frameScale;
                    if(p.position.y > ud.maxHeight) { p.position.y = 0.05; p.position.x = Math.random()*9-4.5; p.position.z = Math.random()*6-1.5; }
                }
                else if(ud.type === 'smoke') {
                    p.position.y += ud.speedY * frameScale;
                    p.position.x += Math.sin(elapsed * ud.swaySpeed) * ud.swayAmp * frameScale;
                    p.position.z += Math.cos(elapsed * ud.swaySpeed) * ud.swayAmp * frameScale;
                    ud.age += delta * (reducedMotion.matches ? 0 : 1);
                    if(ud.age > ud.maxLife || p.position.y > 9) {
                        p.position.set(-1+Math.random()-0.5, 5.7, -4.2+Math.random()-0.5);
                        ud.age = 0;
                    }
                }
                else if(ud.type === 'aurora') {
                    p.position.x += ud.speedX * frameScale * .4;
                    p.position.z += Math.sin(elapsed * ud.waveSpeed + idx) * ud.waveAmp * frameScale;
                    p.position.y += Math.cos(elapsed * ud.waveSpeed * .5 + idx) * .005 * frameScale;
                    if(p.position.x > 6) { p.position.x = -6; p.position.y = 4.2+Math.random()*1.5; p.position.z = Math.random()*8-4; }
                }
                else if(ud.type === 'krathong') {
                    p.position.z += ud.driftSpeed * frameScale * .4;
                    p.position.x += Math.sin(elapsed * ud.waveSpeed + ud.sinOffset) * .003 * frameScale;
                    p.position.y = 0.04 + Math.cos(elapsed * ud.waveSpeed * 0.8 + ud.sinOffset) * ud.waveAmp;
                    if(p.position.z > 5) { p.position.z = -4.5-Math.random()*2; p.position.x = Math.random()*9-4.2; }
                }
                else if(ud.type === 'drift') {
                    p.position.z += ud.speedY * .8 * frameScale;
                    p.position.y = 0.08 + Math.abs(Math.sin(elapsed + idx)) * 0.05;
                    if(p.position.z > 5) p.position.z = -5;
                }
                else if(ud.type === 'float') {
                    p.position.y += ud.speedY * .5 * frameScale;
                    p.position.x += Math.cos(elapsed * 1.5 + idx) * ud.amp * frameScale;
                    if(p.position.y > 6) { p.position.y = 0.2; p.position.x = Math.random()*10-5; p.position.z = Math.random()*10-5; }
                }
            });

            // 灯光闪烁
            flickerLights.forEach(fl => {
                let intensity = fl.base;
                if(fl.speed > 0) intensity += Math.sin(elapsed * fl.speed) * fl.amp;
                if(fl.noise) intensity += Math.cos(elapsed * fl.speed * 1.5) * (fl.amp * 0.5);
                if(fl.neon && !reducedMotion.matches && Math.sin(elapsed * 1.6) > .99) {
                    intensity *= .7;
                    fl.neonMats.forEach(mat => mat.color.setHex(mat === fl.neonMats[0] ? 0xd17b99 : 0x7bbdc9));
                } else if(fl.neon) {
                    fl.neonMats.forEach((mat, i) => mat.color.setHex(i===0 ? 0xff2a85 : 0x00f3ff));
                }
                fl.light.intensity = intensity;
            });

            // 自动巡航
            if(isCruising && !atlasDialog.open && !isDragging) {
                cruiseTimer += delta;
                if(cruiseTimer > CRUISE_DURATION) nextStation();
            }
            document.getElementById('cruise-progress').style.transform = `scaleX(${cruiseTimer / CRUISE_DURATION})`;
            renderer.render(scene, camera);
        }

        // ==================== 7. 交互控制 ====================
        function nextStation() {
            currentIdx = (currentIdx + 1) % STATIONS.length;
            cruiseTimer = 0;
            buildStation(currentIdx);
        }
        function prevStation() {
            currentIdx = (currentIdx - 1 + STATIONS.length) % STATIONS.length;
            cruiseTimer = 0;
            buildStation(currentIdx);
        }
        function toggleCruise() {
            isCruising = !isCruising;
            cruiseTimer = 0;
            updateCruiseUI();
        }

        function updateCruiseUI() {
            document.getElementById('cruise-hud').textContent = isCruising ? '漫游中 · 20 秒一站' : '已停留 · 时间属于你';
            document.getElementById('cruise-label').textContent = isCruising ? '停留此刻' : '继续漫游';
            document.getElementById('cruise-icon').innerHTML = isCruising ? '<path d="M9 6v12 M15 6v12"/>' : '<path d="m9 5 10 7-10 7Z"/>';
            document.getElementById('cruise-button').setAttribute('aria-pressed', String(isCruising));
        }

        function resizeScene() {
            const aspect = window.innerWidth / window.innerHeight;
            viewSize = aspect < .8 ? 12.3 / aspect : aspect < 1.2 ? 12.7 : 10.8;
            camera.left = -viewSize * aspect;
            camera.right = viewSize * aspect;
            camera.top = viewSize;
            camera.bottom = -viewSize;
            camera.updateProjectionMatrix();
            camera.position.set(16, 13, 18);
            camera.lookAt(0, aspect < .8 ? -3 : .4, 0);
            const internalHeight = aspect < .8 ? 680 : 480;
            renderer.setSize(Math.round(internalHeight * aspect), internalHeight, false);
        }

        function openAtlas() {
            if (!atlasDialog.open) atlasDialog.showModal();
        }

        function closeAtlas() {
            atlasDialog.close();
        }

        function selectStation(index) {
            buildStation(index);
            if (atlasDialog.open) closeAtlas();
        }

        ART.forEach((art, index) => {
            const dot = document.createElement('button');
            dot.className = 'station-dot';
            dot.dataset.station = index;
            dot.setAttribute('aria-label', art.title);
            dot.title = art.title;
            dot.addEventListener('click', () => selectStation(index));
            document.getElementById('station-dots').appendChild(dot);
            const card = document.createElement('button');
            card.className = 'atlas-card';
            card.dataset.station = index;
            card.style.setProperty('--card-sky', art.sky);
            card.style.setProperty('--card-glow', art.glow);
            card.style.setProperty('--card-accent', art.accent);
            card.innerHTML = `<div class="atlas-preview"><svg viewBox="0 0 64 64" aria-hidden="true">${art.icon}</svg><span class="atlas-card-number">${String(index + 1).padStart(2, '0')}</span></div><strong>${art.title}</strong><small>${art.en}</small>`;
            card.addEventListener('click', () => selectStation(index));
            document.getElementById('atlas-grid').appendChild(card);
        });
        atlasDialog.addEventListener('click', event => {
            if (event.target !== atlasDialog) return;
            const bounds = atlasDialog.getBoundingClientRect();
            if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) closeAtlas();
        });
        let pointerX = 0;
        renderer.domElement.addEventListener('pointerdown', event => {
            if (atlasDialog.open) return;
            isDragging = true;
            pointerX = event.clientX;
            renderer.domElement.setPointerCapture(event.pointerId);
        });
        renderer.domElement.addEventListener('pointermove', event => {
            if (!isDragging || atlasDialog.open) return;
            userOrbit += (event.clientX - pointerX) * .007;
            pointerX = event.clientX;
        });
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(eventName => renderer.domElement.addEventListener(eventName, () => { isDragging = false; }));
        window.addEventListener('keydown', event => {
            if (atlasDialog.open || event.target.closest('button')) return;
            if (event.key === 'ArrowRight') { event.preventDefault(); nextStation(); }
            if (event.key === 'ArrowLeft') { event.preventDefault(); prevStation(); }
            if (event.code === 'Space') { event.preventDefault(); toggleCruise(); }
            if (event.key.toLowerCase() === 'm') openAtlas();
        });
        reducedMotion.addEventListener('change', () => {
            if (reducedMotion.matches) isCruising = false;
            updateCruiseUI();
        });
        renderer.domElement.addEventListener('webglcontextlost', event => {
            event.preventDefault();
            document.getElementById('load-error').hidden = false;
        });
        renderer.domElement.addEventListener('webglcontextrestored', () => {
            document.getElementById('load-error').hidden = true;
            buildStation(currentIdx);
        });
        window.addEventListener('resize', resizeScene);

        // 启动
        resizeScene();
        updateCruiseUI();
